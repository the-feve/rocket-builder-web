name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            geometry/pyproject.toml
            server/requirements.txt
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libxrender1
          cd server && pip install -r requirements.txt
      - name: Geometry tests
        run: cd geometry && python -m pytest -q
      - name: Server tests
        run: cd server && python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check it serves
        run: |
          docker build -t rocket-builder .
          docker run -d --name rb -p 8000:8000 rocket-builder
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 2; done
          curl -fsS localhost:8000/healthz
          curl -fsS -X POST localhost:8000/api/build -H 'Content-Type: application/json' -d '{}' | head -c 300
          docker logs rb | tail -20
