<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12203A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/static/brand/rb-favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/brand/rb-favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/brand/rb-apple-touch-icon-180.png">
<link rel="preload" href="/static/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/brand.css">
<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<meta name="robots" content="noindex">
<title>Orders · Rocket Builder</title>
<style>
  /* Owner-only order admin. Page styles; the brand (tokens, fonts, header) is in /static/brand.css. */
  body { font-size:14.5px; line-height:1.45; }
  main h1 { font-size:1.5rem; margin:0 0 12px; }
  #who { font-size:12.5px; }
  main { padding:18px 16px 48px; max-width:1200px; margin:0 auto; }
  .msg { padding:12px 14px; border-radius:10px; background:var(--card); border:1px solid var(--line); }
  .msg.err { color:var(--err); background:var(--errbg); border-color:var(--errline); }
  .filters { display:inline-flex; gap:2px; flex-wrap:wrap; margin:0 0 14px; padding:3px; border-radius:10px; background:var(--card); }
  .filters button { padding:5px 12px; border-radius:7px; border:0; background:transparent; color:var(--muted); font:600 13px var(--font-body); cursor:pointer; }
  .filters button:hover { color:var(--ink); }
  .filters button[aria-pressed=true] { background:var(--ink); color:var(--panel); }
  .cards { display:grid; gap:10px; }
  .card { border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:12px 14px; display:grid; grid-template-columns:1.2fr 1fr 1fr auto; gap:6px 18px; align-items:start; }
  .card h2 { font:700 15px/1.3 var(--font-head); margin:0; }
  .card small, .muted { color:var(--muted); }
  .card .st { justify-self:start; padding:2px 8px; font:700 10.5px/1.4 var(--font-head); letter-spacing:.08em; text-transform:uppercase; clip-path:var(--chamfer); background:var(--card); }
  .st.new { color:var(--accent); background:var(--tipbg); } .st.printing { color:var(--warn); background:var(--warnbg); } .st.shipped { color:var(--ok); background:var(--okbg); } .st.cancelled { color:var(--muted); }
  .card select, .card a.btn { font:inherit; font-size:14px; padding:6px 8px; border-radius:7px; border:1px solid var(--line); background:var(--field); color:var(--ink); text-decoration:none; display:inline-block; text-align:center; }
  .card a.btn:hover { background:var(--hover); }
  .card .actions { display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  pre { white-space:pre-wrap; font:12.5px/1.45 var(--font-mono); background:var(--card); padding:10px; border-radius:8px; grid-column:1/-1; margin:4px 0 0; }
  details { grid-column:1/-1; } summary { cursor:pointer; color:var(--muted); font-size:13px; }
  @media (max-width:800px) { .card { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="rb-header"><a class="rb-brand" href="/" title="Rocket Builder: start page"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="rb-hdr-cut" maskUnits="userSpaceOnUse" x="-40" y="-40" width="80" height="80"><rect x="-40" y="-40" width="80" height="80" fill="#fff"/><path d="M-13 6L0 -9L13 6V11L0 -4L-13 11ZM-13 17L0 2L13 17V22L0 7L-13 22Z" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/><path d="M-8 -16H8" stroke="#000" stroke-width="1.6"/></mask></defs><g transform="translate(32 32) scale(1.23) translate(.35 -.35) rotate(45)"><path d="M0 -34C4.2 -29.6 6 -23.5 6 -16V12L3.5 16H-3.5L-6 12V-16C-6 -23.5 -4.2 -29.6 0 -34Z" fill="currentColor" mask="url(#rb-hdr-cut)"/><path d="M-13 6L0 -9L13 6V11L0 -4L-13 11ZM-13 17L0 2L13 17V22L0 7L-13 22Z" fill="#F2652B"/></g></svg><span>Rocket Builder<small>Orders</small></span></a><nav class="rb-nav" aria-label="Site"><span id="who" class="muted"></span><a href="/">← Back to Rocket Builder</a><a class="long" href="https://quiverdesignworks.net/">Quiver Design Works</a></nav></header>
<main>
  <h1>Orders</h1>
  <div class="filters" id="filters">
    <button type="button" data-f="open" aria-pressed="true">Open</button>
    <button type="button" data-f="new" aria-pressed="false">New</button>
    <button type="button" data-f="printing" aria-pressed="false">Printing</button>
    <button type="button" data-f="shipped" aria-pressed="false">Shipped</button>
    <button type="button" data-f="all" aria-pressed="false">All</button>
  </div>
  <div id="out" class="msg">Loading…</div>
</main>
<script type="module">
const out = document.getElementById('out');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let all = [], filter = 'open';
const me = await (await fetch('/api/auth/me')).json().catch(() => ({}));
document.getElementById('who').textContent = me.user ? me.user.email : '';
async function load() {
  const r = await fetch('/api/admin/orders');
  if (!r.ok) {
    out.className = 'msg err';
    out.innerHTML = r.status === 403 && !me.user
      ? 'Sign in on <a href="/">Rocket Builder</a> with the owner account, then come back.'
      : esc((await r.json().catch(() => ({}))).detail || `Error ${r.status}`);
    return;
  }
  all = (await r.json()).orders; render();
}
function render() {
  const list = all.filter(o => filter === 'all' || (filter === 'open' ? ['new', 'printing'].includes(o.status) : o.status === filter));
  out.className = list.length ? 'cards' : 'msg';
  if (!list.length) { out.textContent = 'No orders here.'; return; }
  out.innerHTML = list.map(o => {
    const s = o.shipping, when = new Date(o.created_at * 1000).toLocaleString();
    return `<div class="card">
      <div><h2>${esc(o.name || o.id)}</h2><small>Batch ${esc(o.batch)} · ${esc(when)}</small><br>
        <b>${esc(o.design_name)}</b> × ${o.quantity} · ${esc(o.material)}, ${esc(o.color)}</div>
      <div><small>Customer${o.customer ? ' ' + esc(o.customer) : ''}</small><br>${esc(o.email)}${o.coupon ? `<br><small>Coupon ${esc(o.coupon)}</small>` : ''}${o.paid ? `<br><small>Paid $${(o.paid.total_cents / 100).toFixed(2)} (shipping $${(o.paid.shipping_cents / 100).toFixed(2)}, tax $${(o.paid.tax_cents / 100).toFixed(2)})</small>` : ''}${o.package ? `<br><small>Box ${o.package.box.length}×${o.package.box.width}×${o.package.box.height} in, ${o.package.weight_oz} oz</small>` : ''}</div>
      <div><small>Ship to</small><br>${esc(s.name)}<br>${esc(s.line1)}${s.line2 ? '<br>' + esc(s.line2) : ''}<br>${esc(s.city)}, ${esc(s.state)} ${esc(s.zip)}${s.phone ? '<br>' + esc(s.phone) : ''}</div>
      <div class="actions"><span class="st ${esc(o.status)}">${esc(o.status)}</span>
        <select data-id="${esc(o.id)}" aria-label="Status">${['new', 'printing', 'shipped', 'cancelled'].map(v => `<option ${v === o.status ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <a class="btn" href="/api/admin/orders/${encodeURIComponent(o.id)}/files.zip">Files (ZIP)</a></div>
      ${o.notes ? `<pre>${esc(o.notes)}</pre>` : ''}
      <details><summary>Parts and stability</summary><pre>${o.parts.map(p => `[ ] ${esc(p.name)}.stl  ${p.height_mm} mm, ${p.mass_g} g`).join('\n')}
Stability ${o.stability.margin_cal} cal (${esc(o.stability.status)}); recommended motor ${esc(o.recommended_motor || 'none')}</pre></details>
    </div>`;
  }).join('');
  out.querySelectorAll('select[data-id]').forEach(sel => sel.onchange = async () => {
    const r = await fetch(`/api/admin/orders/${encodeURIComponent(sel.dataset.id)}/status`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: sel.value }) });
    if (r.ok) { const o = await r.json(); all = all.map(x => x.id === o.id ? o : x); render(); }
    else alert('Could not update the status.');
  });
}
document.querySelectorAll('#filters button').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
load();
</script>
</body>
</html>
