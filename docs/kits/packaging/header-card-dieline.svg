<text x="30.0" y="55.0" font-size="16.0" text-anchor="start" font-weight="700" fill="#12203A">Rocket Builder Mini kit · fold-over header card (2-up)</text>
<text x="30.0" y="78.0" font-size="10.0" text-anchor="start" font-weight="500" fill="#6E6E73">Two cards per US Letter sheet, 65-80 lb cover (ivory if you can). Cut, score and fold, punch the slot through both layers, staple over a 4 x 12 in bag.</text>
<text x="30.0" y="96.0" font-size="10.0" text-anchor="start" font-weight="500" fill="#6E6E73">No bleed: the art stays 1/8 in inside the cut, so home printers and a hand trimmer are fine. Dashed grey marks: staple positions.</text>
