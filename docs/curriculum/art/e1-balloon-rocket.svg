<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Space Grotesk, Inter, sans-serif" role="img" aria-labelledby="e1-balloon-rocket-title">
<title id="e1-balloon-rocket-title">Balloon rocket on a string between two chairs: the air rushes out the back and the balloon zooms forward</title>

<!-- floor -->
<rect x="0" y="300" width="640" height="36" fill="#EDE6D8"/>
<path d="M0 300H640" stroke="#12203A" stroke-width="1"/>

<!-- tape measure on the floor: 0 to 4 m -->
<rect x="56" y="310" width="532" height="14" fill="#FFFDF8" stroke="#12203A" stroke-width="1"/>
<path d="M60 310V324M190 310V324M320 310V324M450 310V324M580 310V324M125 310V317M255 310V317M385 310V317M515 310V317" stroke="#12203A" stroke-width="1"/>
<g fill="#6E6E73" font-size="15" font-weight="600" text-anchor="middle">
  <text x="60" y="353">0</text><text x="190" y="353">1 m</text><text x="320" y="353">2 m</text><text x="450" y="353">3 m</text><text x="580" y="353">4 m</text>
</g>

<!-- chairs (left one is the start) -->
<g fill="#FFFDF8" stroke="#12203A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <path d="M40 300V136M48 300V136"/>
  <rect x="36" y="134" width="16" height="10" rx="2"/>
  <rect x="36" y="224" width="74" height="10" rx="2"/>
  <path d="M102 234V300M48 170H40M48 196H40"/>
  <path d="M600 300V136M592 300V136"/>
  <rect x="588" y="134" width="16" height="10" rx="2"/>
  <rect x="530" y="224" width="74" height="10" rx="2"/>
  <path d="M538 234V300M592 170H600M592 196H600"/>
</g>

<!-- start -->
<text x="30" y="120" fill="#12203A" font-size="16" font-weight="600">start</text>

<!-- string, tied tight -->
<path d="M44 140H596" stroke="#12203A" stroke-width="1.5"/>
<circle cx="44" cy="140" r="3.5" fill="#12203A"/>
<circle cx="596" cy="140" r="3.5" fill="#12203A"/>
<text x="520" y="128" fill="#6E6E73" font-size="15" font-weight="600" text-anchor="middle">string</text>

<!-- balloon taped under the straw, opening toward the start -->
<g stroke="#12203A" stroke-linejoin="round">
  <path d="M286 170L270 165V187L286 182" fill="#FFFDF8" stroke-width="2"/>
  <ellipse cx="352" cy="176" rx="68" ry="22" fill="#FFFDF8" stroke-width="2"/>
  <path d="M396 166Q406 170 408 178" fill="none" stroke-width="1"/>
  <!-- straw with the string running through it -->
  <rect x="312" y="134" width="84" height="12" rx="2" fill="#FFFDF8" stroke-width="2"/>
  <path d="M312 140H396" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- two strips of tape -->
  <rect x="326" y="131" width="11" height="34" fill="#FFFDF8" stroke-width="1"/>
  <rect x="370" y="131" width="11" height="34" fill="#FFFDF8" stroke-width="1"/>
</g>

<!-- air puffs out the back -->
<g fill="none" stroke="#6E6E73" stroke-width="1.5">
  <circle cx="256" cy="176" r="6"/><circle cx="238" cy="168" r="5"/><circle cx="236" cy="186" r="4.5"/>
  <circle cx="218" cy="176" r="4"/><circle cx="202" cy="168" r="3"/><circle cx="200" cy="184" r="3"/>
  <path d="M264 164L250 156M264 188L250 196"/>
</g>

<!-- motion: air goes back, balloon goes forward -->
<g fill="#F2652B" stroke="#F2652B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M262 222H166" fill="none"/><path d="M152 222L168 214V230Z"/>
  <path d="M330 100H458" fill="none"/><path d="M472 100L456 92V108Z"/>
</g>
<g fill="#12203A" font-size="16" font-weight="600" text-anchor="middle">
  <text x="212" y="250">air goes back</text>
  <text x="400" y="84">balloon goes forward</text>
</g>
</svg>
