<title id="m4-nose-cone-test-title">Nose-cone drag test: flat, cone and round noses on straw rockets of the same mass; air piles up in front of the flat nose; each is launched from the same squeeze-bottle launcher at the same angle, three trials each, and the mean distances are compared</title>
