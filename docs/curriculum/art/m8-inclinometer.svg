<defs><clipPath id="m8-inclinometer-zoom"><circle cx="138" cy="104" r="70"/></clipPath></defs>
<circle cx="138" cy="104" r="70" fill="#FFFDF8"/><g clip-path="url(#m8-inclinometer-zoom)"><path d="M188.2 53A58 58 0 0 1 87.8 111Z" fill="#FFFDF8" stroke="#12203A" stroke-width="2" stroke-linejoin="round"/><path d="M70.2 121.2L205.8 42.9" stroke="#12203A" stroke-width="4.4" stroke-linecap="round"/><path d="M70.2 121.2L205.8 42.9" stroke="#FFFDF8" stroke-width="1.8" stroke-linecap="round"/><path d="M192.5 62.2L186.9 64.2M195.1 71.9L189.2 73M196 82L190 82M195.1 92.1L189.2 91M192.5 101.8L186.9 99.8M188.2 111L183 108M182.4 119.3L177.8 115.4M175.3 126.4L171.4 121.8M167 132.2L162.5 124.4M157.8 136.5L155.8 130.9M148.1 139.1L147 133.2M138 140L138 134M127.9 139.1L129 133.2M118.2 136.5L120.2 130.9M109 132.2L112 127M100.7 126.4L104.6 121.8M93.6 119.3L98.2 115.4" stroke="#12203A" stroke-width="1"/><path d="M138 82V147" stroke="#12203A" stroke-width="1.5"/><circle cx="138" cy="156.2" r="9.3" fill="#6E6E73" stroke="#12203A" stroke-width="1"/><circle cx="138" cy="82" r="2.3" fill="#12203A"/>
<text x="172" y="145.9" font-size="13" fill="#6E6E73" text-anchor="middle">0°</text>
<path d="M138 128V140" stroke="#F2652B" stroke-width="3"/></g><circle cx="138" cy="104" r="70" fill="none" stroke="#12203A" stroke-width="2"/>
<text x="124" y="152" font-size="17" fill="#12203A" text-anchor="end">30°</text>
<text x="222" y="34" font-size="16" fill="#12203A">height = 20 m × 0.58 + 1.5 m ≈ 13 m</text>
<text x="222" y="56" font-size="13" fill="#6E6E73">baseline × multiplier + eye height</text>
<text x="222" y="76" font-size="13" fill="#6E6E73">multiplier = tan 30° = 0.58</text>
</svg>
